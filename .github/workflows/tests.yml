name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu-tests:
    # Complete test suite on CPU (GPU tests self-skip without CUDA).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package and test dependencies
        run: |
          pip install -e ".[test]"

      - name: Show environment
        run: |
          python - <<'EOF'
          import torch, torch_harmonics, healpy, numpy, camb
          print("torch", torch.__version__, "| cuda:", torch.cuda.is_available())
          print("torch-harmonics", torch_harmonics.__version__)
          print("healpy", healpy.__version__, "| numpy", numpy.__version__)
          print("camb", camb.__version__)
          EOF

      - name: Run test suite
        run: python -m pytest tests/ --cov=torch_harmonics_healpix --cov-report=term --cov-fail-under=95 -o faulthandler_timeout=300
